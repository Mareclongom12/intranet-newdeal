name: CD Pipeline - Prod

on:
  push:
    branches:
      - prod

jobs:
  scan:
    name: Job 1 - Scan Sécurité
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scan vulnerabilités
        run: |
          trivy fs --exit-code 0 --severity HIGH,CRITICAL .

  deploy:
    name: Job 2 - Déploiement Production
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Déployer le site
        run: |
          docker stop intranet-newdeal || true
          docker rm intranet-newdeal || true
          docker pull marcelongom12/intranet-newdeal:latest
          docker run -d --name intranet-newdeal -p 80:80 marcelongom12/intranet-newdeal:latest