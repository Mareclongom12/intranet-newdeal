name: CI Pipeline - Dev

on:
  push:
    branches:
      - dev

jobs:
  build:
    name: Job 1 - Build Image Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker image
        run: |
          docker build -t marcelongom12/intranet-newdeal:latest .

  scan:
    name: Job 2 - Scan Sécurité
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scan vulnerabilités
        run: |
          trivy fs --exit-code 0 --severity HIGH,CRITICAL .

      - name: Scan secrets
        run: |
          trivy fs --scanners secret .

  push:
    name: Job 3 - Push vers Docker Hub
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: marcelongom12
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build et Push image
        run: |
          docker build -t marcelongom12/intranet-newdeal:latest .
          docker push marcelongom12/intranet-newdeal:latest